        Op.118-2の間奏曲はクラシックにハマったきっかけの曲であり思い入れがある．Perahiaは変に飾らずに自然に歌って弾いているが，その中にも威容を感じられるのが好みである．無骨さの中にさまざまな感情が秘められているBrahmsによくあっていると感じる．他にもHandelの主題による変奏曲とフーガも大変素晴らしい．Schiffによる演奏と並び最も好きな録音である． <br>
        特におすすめ：Handelの主題による変奏曲とフーガ, Op.118.
